{% extends 'core/base.html' %} 

{% block title %}Signup{% endblock %} 

{% block content %}
<div class="flex justify-center items-center min-h-[80vh] w-full px-4 sm:px-6 my-6">
  <div class="w-full max-w-sm sm:max-w-md bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200">
    
    <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 text-center mb-6 tracking-tight">
      SIGNUP
    </h2>

    {% if messages %}
      {% for message in messages %}
        <div class="p-3 mb-4 rounded-xl text-sm font-medium border {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200{% elif message.tags == 'success' %}bg-green-50 text-green-700 border-green-200{% else %}bg-gray-100 text-gray-700 border-gray-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="username" class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Choose a username"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm text-gray-900 placeholder-gray-400"
        />
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="Enter your email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm text-gray-900 placeholder-gray-400"
        />
      </div>

      <div>
        <label for="password1" class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
        <input
          id="password1"
          type="password"
          name="password1"
          placeholder="Create a password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm text-gray-900 placeholder-gray-400"
        />
      </div>

      <div>
        <label for="password2" class="block text-xs font-semibold text-gray-600 mb-1">Confirm Password</label>
        <input
          id="password2"
          type="password"
          name="password2"
          placeholder="Confirm your password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm text-gray-900 placeholder-gray-400"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold text-sm rounded-xl transition shadow-sm mt-2"
      >
        Signup
      </button>
    </form>

    <p class="text-center mt-6 text-sm text-gray-600">
      Already have an account?
      <a href="{% url 'login' %}" class="text-green-600 hover:text-green-700 font-semibold underline transition">
        Login here
      </a>
    </p>

  </div>
</div>
{% endblock %}
